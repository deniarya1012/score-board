<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard Layar Utama</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            color: #ffffff;
            font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .scoreboard-container {
            display: flex; justify-content: space-around; align-items: center;
            width: 90%; max-width: 1200px; background: rgba(255, 255, 255, 0.1);
            padding: 50px; border-radius: 20px; backdrop-filter: blur(10px);
        }
        .team { display: flex; flex-direction: column; align-items: center; width: 45%; }
        .team-name { font-size: 4rem; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
        .score { font-size: 18rem; font-weight: bold; line-height: 1; text-shadow: 4px 4px 10px rgba(0,0,0,0.6); }
        .divider { font-size: 6rem; font-weight: bold; color: rgba(255,255,255,0.5); padding-bottom: 50px; }
        .btn-fullscreen { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); color: #fff; padding: 10px 20px; border: 1px solid #fff; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <button class="btn-fullscreen" onclick="toggleFullScreen()">📺 Full Screen</button>

    <div class="scoreboard-container">
        <div class="team">
            <div class="team-name" id="nameA">TIM A</div>
            <div class="score" id="scoreA">0</div>
        </div>
        <div class="divider">:</div>
        <div class="team">
            <div class="team-name" id="nameB">TIM B</div>
            <div class="score" id="scoreB">0</div>
        </div>
    </div>

    <!-- Load Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Mendengarkan update dari server
        socket.on('updateData', (data) => {
            document.getElementById('nameA').innerText = data.teamA;
            document.getElementById('nameB').innerText = data.teamB;
            document.getElementById('scoreA').innerText = data.scoreA;
            document.getElementById('scoreB').innerText = data.scoreB;
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }
    </script>
</body>
</html>
