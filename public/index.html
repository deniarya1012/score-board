<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard Layar Utama</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #000428 0%, #004e92 100%); color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .scoreboard-container { display: flex; justify-content: space-around; align-items: center; width: 90%; max-width: 1200px; background: rgba(255, 255, 255, 0.1); padding: 50px; border-radius: 20px; backdrop-filter: blur(10px); }
        .team { display: flex; flex-direction: column; align-items: center; width: 45%; }
        .team-name { font-size: 4rem; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
        .score { font-size: 18rem; font-weight: bold; line-height: 1; }
        .divider { font-size: 6rem; font-weight: bold; color: rgba(255,255,255,0.5); padding-bottom: 50px; }
    </style>
</head>
<body>
    <div class="scoreboard-container">
        <div class="team">
            <div class="team-name" id="nameA">TIM A</div>
            <div class="score" id="scoreA">0</div>
        </div>
        <div class="divider">:</div>
        <div class="team">
            <div class="team-name" id="nameB">TIM B</div>
            <div class="score" id="scoreB">0</div>
        </div>
    </div>

    <!-- SDK Client Pusher -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        const pusher = new Pusher('8dcb21498ababda58463', {
            cluster: 'ap1'
        });

        const channel = pusher.subscribe('scoreboard');
        channel.bind('update-data', function(data) {
            document.getElementById('nameA').innerText = data.teamA;
            document.getElementById('nameB').innerText = data.teamB;
            document.getElementById('scoreA').innerText = data.scoreA;
            document.getElementById('scoreB').innerText = data.scoreB;
        });
    </script>
</body>
</html>
